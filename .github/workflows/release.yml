name: Build release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qr-code-generator-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build self-contained plugin
        run: |
          mkdir -p build/qr_code_generator/vendor
          cp -a qr_code_generator/. build/qr_code_generator/
          python -m pip install --disable-pip-version-check --no-compile \
            --target build/qr_code_generator/vendor \
            'qrcode==8.2' 'python-barcode==0.16.1'
          python scripts/prepare_vendor.py build/qr_code_generator/vendor
          find build/qr_code_generator/vendor -maxdepth 1 -type d \
            -name '*.dist-info' -exec rm -rf {} +
          find build/qr_code_generator/vendor -type d -name '__pycache__' \
            -prune -exec rm -rf {} +
          cd build
          zip -q -r ../qr_code_generator-0.0.1.zip qr_code_generator
      - name: Validate ZIP structure and dependencies
        run: |
          python - <<'PY'
          from zipfile import ZipFile

          archive = "qr_code_generator-0.0.1.zip"
          with ZipFile(archive) as package:
              names = package.namelist()
              package.testzip()
          roots = {name.split("/", 1)[0] for name in names if name}
          assert roots == {"qr_code_generator"}, roots
          required = (
              "qr_code_generator/__init__.py",
              "qr_code_generator/metadata.txt",
              "qr_code_generator/vendor/qrcode/__init__.py",
              "qr_code_generator/vendor/barcode/__init__.py",
          )
          assert all(item in names for item in required)
          PY
      - name: Publish release 0.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete 0.0.1 --cleanup-tag --yes || true
          gh release create 0.0.1 qr_code_generator-0.0.1.zip \
            --title "QR Code Generator 0.0.1" \
            --notes-file qr_code_generator/CHANGELOG.md \
            --latest
